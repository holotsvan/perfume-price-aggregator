<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Add Perfume - PPA')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    
    <div class="main-content">
        <div class="topbar">
            <h1 class="page-title">Add New Perfume</h1>
        </div>

        <div class="content-area">
            <div class="panel" style="max-width: 500px;">
                <form id="addPerfumeForm" onsubmit="submitForm(event)">
                    <div class="form-group">
                        <label for="brand">Brand</label>
                        <input type="text" id="brand" name="brand" required placeholder="e.g. Dior">
                    </div>
                    
                    <div class="form-group">
                        <label for="name">Perfume Name</label>
                        <input type="text" id="name" name="name" required placeholder="e.g. Sauvage">
                    </div>
                    
                    <div class="form-group">
                        <label for="gender">Gender / Category</label>
                        <select id="gender" name="gender">
                            <option value="Men">Men</option>
                            <option value="Women">Women</option>
                            <option value="Unisex">Unisex</option>
                        </select>
                    </div>
                    
                    <div style="margin-top: 24px;">
                        <button type="submit" class="btn btn-primary">Save Perfume</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function submitForm(e) {
            e.preventDefault();
            
            const data = {
                brand: document.getElementById('brand').value,
                name: document.getElementById('name').value,
                gender: document.getElementById('gender').value
            };
            
            fetch('/api/perfumes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(res => {
                if(res.ok) {
                    window.location.href = '/perfumes';
                } else {
                    alert('Error adding perfume.');
                }
            });
        }
    </script>
</body>
</html>
