spring:
  application:
    name: perfume-price-aggregator
  datasource:
    url: jdbc:h2:file:./data/perfume_db
    driverClassName: org.h2.Driver
    username: sa
    password: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    com.aggregator: DEBUG
    org.hibernate.SQL: INFO
